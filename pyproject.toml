[project]
name = "omie-finance-mcp"
version = "0.1.0"
description = "MCP Server para integração com o ERP OMIE — controle financeiro via IA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["omie", "erp", "mcp", "financeiro", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.1",
    # <2: o mcp 2.0 removeu `mcp.server.fastmcp`, que server.py e as tools
    # importam. Sem o teto, um build limpo (Docker) resolve 2.x e morre no
    # import. Migrar para o 2.x é tarefa à parte.
    "mcp[cli]>=1.26.0,<2",
    # Configuração (config.py). Requer python-dotenv para ler os .env.
    "pydantic-settings>=2.4",
    "python-dotenv>=1.2.2",
    "starlette>=0.40",
    # Importado direto pelo server.main(): dirigimos o uvicorn nós mesmos para
    # poder embrulhar o app ASGI no middleware de autenticação.
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/denilsonpy/omie-finance-mcp"
Repository = "https://github.com/denilsonpy/omie-finance-mcp"
"Bug Tracker" = "https://github.com/denilsonpy/omie-finance-mcp/issues"

[project.scripts]
omie-finance-mcp = "omie_finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omie_finance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Ver o comentário do import em tests/test_http_multitenant.py.
    "ignore:Use `streamable_http_client` instead.:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
